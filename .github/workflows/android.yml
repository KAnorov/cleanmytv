name: Android APK

# A test APK on demand, and a release asset when an android-* tag is pushed.
on:
  workflow_dispatch:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CleanMyTV-android-0.1.1.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CleanMyTV-android
          path: CleanMyTV-android-0.1.1.apk
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: CleanMyTV-android-0.1.1.apk
          name: CleanMyTV для Android
          body: |
            MVP Android-приложения CleanMyTV.

            - Подключение к TV по Wi-Fi через ADB (порт 5555).
            - Очистка по встроенным upstream-спискам с точкой восстановления.
            - Установка лаунчера CleanYourTV 2.4 и назначение Home.

            Установите APK на телефон (Android 10+), разрешив установку из неизвестных источников.
            Телефон и TV должны быть в одной Wi-Fi сети; на TV включена «Отладка по USB».
